[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "phone-dino"
version = "0.7.4"
description = "Fail-closed internal image observation service for phone_cv"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=10.4,<12",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
phone-dino-prepare-fixtures = "phone_dino.fixture_cli:main"
phone-dino-production-preflight = "phone_dino.preflight:main"
phone-dino-compile-artifact = "phone_dino.compiler:main"
phone-dino-digest-repository = "phone_dino.repository_digest:main"
phone-dino-generate-synthetic-suite = "phone_dino.synthetic_scene:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
synthetic = [
  "numpy>=2.1,<3",
  "opencv-contrib-python-headless>=4.10,<5",
]
vision = [
  "numpy>=2.1,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]
segmentation = [
  "numpy>=2.1,<3",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "timm>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phone_dino"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
